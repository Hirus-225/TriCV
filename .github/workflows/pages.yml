# Publie le site statique (dossier web/) sur GitHub Pages.
#
# Pas d'étape de construction : le site est publié tel quel. C'est tout
# l'intérêt du choix fait au §2 du document de migration — aucun outil entre
# ce qu'on écrit et ce qui est servi, donc rien qui puisse introduire une
# différence entre les deux.
#
# LA PAGE DE TESTS N'EST PAS PUBLIÉE. web/tests/ lit le corpus de CV dans
# tests/corpus/, qui est à la racine du dépôt et non dans web/ : en ligne, ces
# fichiers n'existeraient pas et la page afficherait des erreurs. C'est une
# page de développement, à ouvrir en local avec `python3 -m http.server`.
#
# Prérequis, une seule fois : Settings → Pages → Build and deployment →
# Source : « GitHub Actions ».
#
# Les actions sont épinglées par l'empreinte de leur commit — et non par un
# numéro de version, qu'on peut déplacer. La version figure en commentaire.

name: Publication GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

# Droits minimaux : lire le dépôt, publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une publication en cours n'est pas annulée.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Préparer le site (web/ sans la page de tests)
        run: |
          mkdir _site
          cp -R web/. _site/
          rm -rf _site/tests

      - name: Vérifier qu'aucune adresse distante ne s'est glissée dans le code
        # Dernier filet avant publication. La politique de sécurité de la page
        # bloquerait déjà un appel extérieur côté navigateur ; ce contrôle-ci
        # le fait échouer PLUS TÔT, au moment de la publication, là où
        # l'erreur est lisible — plutôt que chez un utilisateur, devant une
        # ressource qui ne se charge pas.
        #
        # IL NE REGARDE QUE NOTRE CODE, pas vendor/. Les bibliothèques
        # contiennent des adresses en quantité — URL d'espaces de noms XML,
        # dépôts cités dans les licences, liens de documentation — qui ne sont
        # JAMAIS chargées. Les y chercher reviendrait à écrire une liste
        # d'exceptions de plus en plus longue, qui finirait par laisser passer
        # ce qu'on voulait attraper. Le contenu de vendor/ est examiné une
        # fois, au moment où on l'y place, et consigné dans vendor/LISEZMOI.md.
        #
        # Quatre adresses sont admises dans notre code, et aucune n'est
        # chargée : le lien de navigation vers le portfolio ; localhost, qui
        # ne figure que dans le message expliquant comment servir la page en
        # local ; et les deux espaces de noms XML du format Word, qui sont des
        # IDENTIFIANTS de balises — docx-texte.js s'en sert pour reconnaître
        # un paragraphe, il ne va rien chercher à cette adresse.
        run: |
          trouve=$(grep -rnoE 'https?://[^"'"'"' )]+' _site/js _site/css _site/*.html \
            | grep -vE 'https://charleszogoue\.ci' \
            | grep -vE 'http://localhost' \
            | grep -vE 'http://schemas\.openxmlformats\.org/wordprocessingml/2006/main' \
            | grep -vE 'http://schemas\.openxmlformats\.org/markup-compatibility/2006' \
            || true)
          if [ -n "$trouve" ]; then
            echo "Adresses distantes trouvées dans le code du site :"
            echo "$trouve"
            exit 1
          fi
          echo "Aucune adresse distante dans le code du site."

      - name: Configurer Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Publier
        id: publication
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
